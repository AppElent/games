name: Setup
description: >-
  pnpm, Node and a frozen install. Use after actions/checkout; a local action
  only exists once the repository is checked out. The Node major lives here.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with: { node-version: 22, cache: pnpm }
    - run: pnpm install --frozen-lockfile
      shell: bash
