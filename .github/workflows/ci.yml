name: CI
# Pull requests run it directly; on main, deploy.yml calls it before shipping.
on:
  pull_request:
  workflow_call:
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # A new push supersedes a PR run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Same command as local: lint, typecheck, then tests.
      - run: pnpm verify
      # Manifest and .env.example only; needs no Infisical access.
      - run: pnpm run env:check
      - run: node scripts/check-project.mjs --strict
      # Build catches bundling/plugin/SSR-compile breakage that typecheck + tests
      # miss; preview.yml builds only for labelled PRs.
      - run: pnpm build
