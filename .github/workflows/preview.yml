name: PR Preview

# Opt-in: a PR gets a preview backend + Worker only while it carries the
# `preview:web` label. Pushes to a labelled PR redeploy; removing the label or
# closing the PR deletes the Worker. Other label changes are ignored.
# Values come from repository scope as PREVIEW_<name>, written by
# `pnpm env:apply preview --only github` (docs/runbooks/environment.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

# The per-PR Worker; deploy creates it and cleanup deletes it.
env:
  WORKER_NAME: games-pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    # Fork and Dependabot runs get no Actions secrets, so a deploy cannot work.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'preview:web') &&
      github.event.action != 'closed' && github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:web')
    # Job-level, so a run whose jobs are all skipped (an unrelated label) does
    # not cancel an in-flight deploy. Cleanup shares the group and supersedes it.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
      CONVEX_DEPLOY_KEY: ${{ secrets.PREVIEW_CONVEX_DEPLOY_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.PREVIEW_VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.PREVIEW_VITE_SENTRY_DSN }}
      # Uploads source maps; the Vite Sentry plugin is disabled without it.
      SENTRY_AUTH_TOKEN: ${{ secrets.PREVIEW_SENTRY_AUTH_TOKEN }}
      # The Cloudflare Vite plugin picks the wrangler env at build time. `pr`
      # clears the production routes, so a preview never claims the domain,
      # and sets environment_name for the Worker's Sentry reports.
      CLOUDFLARE_ENV: pr
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Convex provisions/refreshes preview backend pr-<N>, exposes its URL as
      # $CONVEX_URL inside --cmd, then runs the build (bridge CONVEX_URL ->
      # VITE_CONVEX_URL since the app reads the Vite-prefixed var at build
      # time). VITE_SENTRY_ENVIRONMENT tags browser reports as preview. No
      # --preview-run seed: the games need no reference data
      # (quiz.ensureSampleSet creates the sample quiz on demand).
      - name: Convex preview deploy + build
        run: |
          pnpm exec convex deploy \
            --preview-create pr-${{ github.event.pull_request.number }} \
            --cmd-url-env-var-name CONVEX_URL \
            --cmd 'VITE_CONVEX_URL=$CONVEX_URL VITE_SENTRY_ENVIRONMENT=preview pnpm build'

      - name: Deploy Worker (per-PR)
        id: deploy
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --name "$WORKER_NAME" 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"
          URL=$(grep -oE 'https://[^ ]+workers\.dev' "$RUNNER_TEMP/wrangler-deploy.log" | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # A preview that inherits production routes takes over the production domain.
      - name: Guard against custom domains
        run: |
          if grep -qi 'custom domain' "$RUNNER_TEMP/wrangler-deploy.log"; then
            echo "::error::The preview Worker claimed a custom domain. Redeploy production, then fix the wrangler pr env."
            exit 1
          fi

      - name: Upsert PR comment
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        with:
          script: |
            const { upsertPrComment } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/upsert-pr-comment.js`);
            const body = `### Preview\n- App: ${process.env.URL}\n- Convex preview: \`pr-${process.env.PR}\``;
            await upsertPrComment({ github, context }, '<!-- pr-preview-comment -->', body);

  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview:web'))
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Close always runs cleanup, so a PR that never deployed has no Worker.
      # Tolerate only that (code 10007); any other failure must stay visible.
      - name: Delete Worker
        run: |
          status=0; out=$(pnpm exec wrangler delete --name "$WORKER_NAME" 2>&1) || status=$?
          echo "$out"
          [ "$status" -eq 0 ] || echo "$out" | grep -qE "10007|does not exist" || exit "$status"
      # Convex preview deployments idle-expire automatically (~14 days).
      # No reliable CLI delete today; prune from the dashboard if needed.
