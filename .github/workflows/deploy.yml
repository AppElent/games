name: Deploy

# A merge to main ships production: Convex functions and schema first, then
# the Worker built against them. "Run workflow" redeploys main by hand. The
# main ruleset only accepts PRs whose `check` passed, so this does not re-run
# the checks. Mobile is separate: builds and OTA updates go through EAS.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-flight; queue behind the previous one instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Every value below is scoped to the `production` GitHub Environment and
    # written there by `pnpm env:apply production`.
    environment: production
    permissions: { contents: read }
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - name: Guard production ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys run from main only (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Fails before anything ships when the environment is half configured.
      # An Environment without its own CONVEX_DEPLOY_KEY silently inherits the
      # repo-level preview key, so insist on a production key explicitly.
      - name: Check environment
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            *) echo "::error::CONVEX_DEPLOY_KEY in the production Environment is missing or not a production key."; exit 1 ;;
          esac
          node scripts/env.mjs check production --ci

      # The deploy key alone picks the production deployment; see the
      # deploy:production script, which local `pnpm deploy:prod` runs too.
      - name: Deploy Convex, build, deploy Worker
        run: pnpm run deploy:production
