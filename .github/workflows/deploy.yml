name: Deploy

# Every merge to main ships, one change at a time (developer-home
# standards/releases.md): the CI checks again (admins can bypass the ruleset),
# then staging (Convex, the games-staging Worker, smoke check), then production
# (Convex, the games Worker, smoke check), then the preview app's
# over-the-air update, whose builds call the production backend. No job waits
# for a person: the merge is the gate, so a change that could break installed
# app builds waits for the owner before merging. "Run workflow" on main
# redeploys main through the same chain. The production app's update is the
# daily mobile-update-production.yml; builds stay separate (mobile-build.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-flight; queue behind the previous one instead. A
# newer queued run replaces an older queued one, so production always moves
# forward to the newest main.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }

  staging:
    needs: checks
    uses: ./.github/workflows/deploy-target.yml
    permissions: { contents: read }
    secrets: inherit
    with:
      environment: staging
      # wrangler.jsonc: top level = games (production), env.staging = games-staging.
      cloudflare-env: staging
      worker: games-staging
      origin: https://arcade-club-stg.appelent.nl

  production:
    needs: staging
    uses: ./.github/workflows/deploy-target.yml
    permissions: { contents: read }
    secrets: inherit
    with:
      environment: production
      cloudflare-env: ""
      worker: games
      origin: https://arcade-club.appelent.nl

  # Publishes main's JavaScript to the preview channel once the production
  # backend it calls is live, and only when an installed build can load it;
  # otherwise the run summary says a rebuild is due. See
  # apps/mobile/scripts/ci-publish-update.mjs. Preview values live in
  # repository scope as PREVIEW_<name>.
  mobile-update:
    needs: production
    runs-on: ubuntu-latest
    # Moves the ota-preview tag after publishing.
    permissions: { contents: write }
    env:
      EXPO_TOKEN: ${{ secrets.PREVIEW_EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.PREVIEW_SENTRY_AUTH_TOKEN }}
      # Android is paused until this repository variable is `true`
      # (developer-home standards/releases.md, "Android pause").
      ANDROID_ENABLED: ${{ vars.ANDROID_ENABLED }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/require-expo-token
      - name: Publish preview update
        run: node apps/mobile/scripts/ci-publish-update.mjs preview
