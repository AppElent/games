<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backgammon on the phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; margin-top: 44px">
    <button type="button" aria-label="{{t.back}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.accent}}; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg aria-hidden="true" width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600">Backgammon</h1>
    <button type="button" aria-label="{{t.options}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.accent}}; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>

  <div style="padding: 4px 20px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; background: radial-gradient(circle at 36% 28%, #fffdf6 0%, #f3e6c4 46%, #d7c092 100%); border: 1px solid #b09863"></div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.orange}}">{{t.kicker}}</span>
        <span style="font-size: 17px; font-weight: 600">{{t.toMove}}</span>
      </div>
    </div>
    <span style="font-size: 13px; color: {{c.muted}}">{{t.seat}}</span>
  </div>

  <div style="padding: 0 20px">
    <dc-import name="Board" scene="{{scene}}" width="{{ 350 }}" direction="{{direction}}" pointer="touch" lang="{{lang}}" theme="{{theme}}" show-haptic="{{ true }}" hint-size="350px,420px"></dc-import>
  </div>

  <div style="margin-top: auto; padding: 16px 20px 40px; display: flex; gap: 12px">
    <button type="button" style="flex: 1; min-height: 50px; border-radius: 999px; font: inherit; font-size: 17px; font-weight: 600; background: transparent; color: {{c.text}}; border: 1px solid {{c.borderStrong}}">{{t.undo}}</button>
    <button type="button" disabled="{{endDisabled}}" style="flex: 1; min-height: 50px; border-radius: 999px; font: inherit; font-size: 17px; font-weight: 600; background: {{c.accent}}; color: {{c.onAccent}}; border: 0; opacity: {{endOpacity}}">{{t.endTurn}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"lang":{"editor":"enum","options":["en","nl"],"default":"en"},"scene":{"editor":"enum","options":["idle","lifted","hover","illegal","hit","bearoff","live"],"default":"hover"},"direction":{"editor":"enum","options":["A","B"],"default":"A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme || 'dark';
    const lang = this.props.lang || 'en';
    const scene = this.props.scene || 'hover';
    const dark = theme === 'dark';
    const c = dark
      ? { bg: '#080a12', surface: '#121626', text: '#f8fafc', muted: '#aab6cc', accent: '#22d3ee', onAccent: '#04121a', orange: '#fb923c', borderStrong: 'rgba(148,163,184,0.6)' }
      : { bg: '#f8fafc', surface: '#ffffff', text: '#0f172a', muted: '#475569', accent: '#0e7490', onAccent: '#ffffff', orange: '#ba3e0c', borderStrong: 'rgba(15,23,42,0.5)' };
    const t = lang === 'nl'
      ? { back: 'Terug', options: 'Opties', kicker: 'Lokaal spel', toMove: 'Wit is aan zet', seat: 'Bar 0 / Uit 0', undo: 'Ongedaan maken', endTurn: 'Beurt beëindigen' }
      : { back: 'Back', options: 'Options', kicker: 'Local game', toMove: 'White to move', seat: 'Bar 0 / Off 0', undo: 'Undo', endTurn: 'End turn' };
    if (scene === 'bearoff') t.seat = lang === 'nl' ? 'Bar 0 / Uit 1' : 'Bar 0 / Off 1';
    const endDisabled = scene !== 'live';
    return { c, t, scene, lang, theme, direction: this.props.direction || 'A', endDisabled, endOpacity: endDisabled ? 0.38 : 1 };
  }
}
</script>
</body>
</html>
