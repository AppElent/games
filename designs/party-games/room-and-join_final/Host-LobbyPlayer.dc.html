<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby, player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button,a{font:inherit;cursor:pointer}
@keyframes pulse{50%{opacity:.45}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 16px; background: #080a12; color: #f8fafc; font-family: Manrope, ui-sans-serif, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <button type="button" aria-label="Room menu" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.34); background: #121626; color: #f8fafc; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
      <span style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #fbbf24;">Beat the Clock</span>
      <span style="font-size: 13px; font-weight: 600; color: #aab6cc;">Hosted by Sam · 30 s · first to 30</span>
    </div>
    <span style="font-size: 13px; font-weight: 700; color: #aab6cc;">Room K7QX</span>
  </div>

  <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
    <div aria-busy="true" aria-label="Loading the room" style="display: flex; flex-direction: column; gap: 12px;">
      <span style="height: 30px; width: 70%; border-radius: 8px; background: #191f34; animation: pulse 1.4s ease-in-out infinite;"></span>
      <span style="height: 18px; width: 50%; border-radius: 6px; background: #191f34; animation: pulse 1.4s ease-in-out infinite;"></span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px;">
        <span style="height: 180px; border-radius: 18px; background: #121626; animation: pulse 1.4s ease-in-out infinite;"></span>
        <span style="height: 180px; border-radius: 18px; background: #121626; animation: pulse 1.4s ease-in-out infinite;"></span>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ loaded }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.15;">{{ title }}</span>
      <span style="font-size: 15px; line-height: 22px; color: #aab6cc;">{{ sub }}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{ teams }}" as="tm" hint-placeholder-count="2">
        <sc-if value="{{ tm.mine }}" hint-placeholder-val="{{ false }}">
          <button type="button" aria-pressed="true" onClick="{{ tm.pick }}" style="min-height: 196px; display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 14px; border-radius: 18px; border: 2px solid #fbbf24; background: rgba(251, 191, 36, 0.16); color: #f8fafc; text-align: left;">
            <span style="display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 20px; font-weight: 800;">{{ tm.name }}</span>
              <span style="width: 26px; height: 26px; border-radius: 999px; background: #fbbf24; color: #1c1404; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></span>
            <sc-for list="{{ tm.players }}" as="p" hint-placeholder-count="3"><span style="font-size: 16px; font-weight: 600; min-height: 26px;">{{ p }}</span></sc-for>
          </button>
        </sc-if>
        <sc-if value="{{ tm.other }}" hint-placeholder-val="{{ true }}">
          <button type="button" aria-pressed="false" onClick="{{ tm.pick }}" style="min-height: 196px; display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 14px; border-radius: 18px; border: 2px solid rgba(148, 163, 184, 0.18); background: #121626; color: #f8fafc; text-align: left;">
            <span style="font-size: 20px; font-weight: 800;">{{ tm.name }}</span>
            <sc-for list="{{ tm.players }}" as="p" hint-placeholder-count="2"><span style="font-size: 16px; font-weight: 600; min-height: 26px;">{{ p }}</span></sc-for>
            <span style="margin-top: auto; font-size: 14px; font-weight: 700; color: #22d3ee;">{{ tm.cta }}</span>
          </button>
        </sc-if>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #191f34;">
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: #34d399; animation: pulse 1.6s ease-in-out infinite;"></span>
      <span style="font-size: 15px; line-height: 21px;">{{ status }}</span>
    </div>
    <a href="Clock-Teammate.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; color: #aab6cc; font-size: 14px; font-weight: 700; text-decoration: none;">Prototype: skip to the game</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["pickTeam","onTeam","lateJoin","loading"],"default":"pickTeam"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { team: null };
  }
  componentDidUpdate(prev) {
    if (prev.state !== this.props.state) this.setState({ team: null });
  }
  renderVals() {
    const s = this.props.state ?? 'pickTeam';
    const late = s === 'lateJoin';
    const team = this.state.team ?? (s === 'onTeam' ? 0 : null);
    const base = [
      { name: 'Comets', players: ['Sam', 'Noor'] },
      { name: 'Rockets', players: ['Daan', 'Mila', 'Jesse'] },
    ];
    const teams = base.map((t, i) => ({
      name: t.name,
      players: team === i ? t.players.concat(['You']) : t.players,
      mine: team === i,
      other: team !== i,
      cta: team === null ? 'Join ' + t.name : 'Switch',
      pick: () => this.setState({ team: i }),
    }));
    const picked = team !== null;
    return {
      loading: s === 'loading',
      loaded: s !== 'loading',
      teams,
      title: picked ? "You're on " + base[team].name : late ? 'Game in progress' : 'Pick your team',
      sub: picked
        ? (late ? 'You play from your team’s next turn. You can switch teams until then.' : 'You can switch until Sam starts the game.')
        : (late ? 'Turn 7 is running. Pick a team and you join from its next turn.' : 'Tap a team. Teams should be about even.'),
      status: picked ? (late ? 'Rockets are describing now. Hang on.' : 'Waiting for Sam to start the game') : 'Pick a team to get ready',
    };
  }
}
</script>
</body>
</html>
