<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Doen, Durven of de Waarheid, afgelopen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button,a{font:inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 20px; background: #080a12; color: #f8fafc; font-family: Manrope, ui-sans-serif, system-ui, sans-serif;">
  <div style="display: flex; flex-direction: column; gap: 2px;">
    <span style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #a78bfa;">Doen, durven of de waarheid</span>
    <span style="font-size: 13px; font-weight: 600; color: #aab6cc;">Kamer K7QX · 6 spelers</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
      <span style="width: 72px; height: 72px; border-radius: 22px; background: rgba(167, 139, 250, 0.16); color: #a78bfa; display: flex; align-items: center; justify-content: center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.4 5.2 5.6.6-4.2 3.8 1.2 5.6L12 15.4 7 18.2l1.2-5.6L4 8.8l5.6-.6L12 3Z"/></svg>
      </span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 38px; line-height: 1.1; font-weight: 700;">Dat was het!</h1>
      <span style="font-size: 16px; line-height: 23px; color: #aab6cc;">Lotte heeft het spel beëindigd na 4 rondes.</span>
    </div>

    <dl style="margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{ stats }}" as="st" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column-reverse; gap: 2px; padding: 14px 12px; border-radius: 18px; background: #121626; border: 1px solid rgba(148, 163, 184, 0.18); text-align: center;">
          <dt style="font-size: 13px; font-weight: 700; color: #aab6cc;">{{ st.label }}</dt>
          <dd style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700;">{{ st.value }}</dd>
        </div>
      </sc-for>
    </dl>

    <div style="padding: 14px 16px; border-radius: 18px; background: #121626; border: 1px solid rgba(148, 163, 184, 0.18); display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 13px; font-weight: 700; color: #aab6cc;">Meest gekozen</span>
      <span style="font-size: 17px; font-weight: 700;">Waarheid, 11 keer</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <sc-if value="{{ host }}" hint-placeholder-val="{{ true }}">
      <a href="Truth-Pick.dc.html" style="min-height: 52px; border-radius: 999px; background: #22d3ee; color: #04121a; font-size: 16px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center;">Nog een keer</a>
      <a href="Host-SettingsTruth.dc.html" style="min-height: 48px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.34); color: #f8fafc; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center;">Niveaus aanpassen</a>
    </sc-if>
    <sc-if value="{{ restarting }}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled="disabled" style="min-height: 52px; border-radius: 999px; border: 0; background: #22d3ee; color: #04121a; font-size: 16px; font-weight: 800; opacity: 0.45; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 999px; border: 2.5px solid #04121a; border-right-color: transparent; animation: spin 0.8s linear infinite;"></span>Opnieuw starten…
      </button>
    </sc-if>
    <sc-if value="{{ player }}" hint-placeholder-val="{{ false }}">
      <div role="status" style="padding: 14px 16px; border-radius: 14px; background: #191f34; font-size: 15px; line-height: 21px; text-align: center;">Lotte kan een nieuw spel starten. Blijf hier om mee te doen.</div>
    </sc-if>
    <button type="button" style="min-height: 44px; border: 0; background: transparent; color: #22d3ee; font-size: 15px; font-weight: 700;">Terug naar de arcade</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["host","player","restarting"],"default":"host"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'host';
    return {
      host: s === 'host', player: s === 'player', restarting: s === 'restarting',
      stats: [{ label: 'Rondes', value: '4' }, { label: 'Gedaan', value: '21' }, { label: 'Overgeslagen', value: '3' }],
    };
  }
}
</script>
</body>
</html>
