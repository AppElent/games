<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Doen, Durven of de Waarheid, opdracht</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button,a{font:inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 20px; background: #080a12; color: #f8fafc; font-family: Manrope, ui-sans-serif, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <button type="button" aria-label="Menu" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.34); background: #121626; color: #f8fafc; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
      <span style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #a78bfa;">Doen, durven of de waarheid</span>
      <span style="font-size: 13px; font-weight: 600; color: #aab6cc;">Ronde 3 · 6 spelers</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="width: 48px; height: 48px; border-radius: 999px; background: #191f34; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700;">L</span>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 20px; font-weight: 800;">Lotte</span>
      <span style="font-size: 15px; color: #aab6cc;">koos {{ p.cat }}</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #a78bfa;">{{ p.cat }}</span>
      <span style="padding: 3px 9px; border-radius: 999px; background: rgba(167, 139, 250, 0.16); color: #a78bfa; font-size: 12px; font-weight: 800;">{{ p.level }}</span>
    </div>
    <p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: {{ p.size }}; font-weight: 700; line-height: 1.18;">{{ p.text }}</p>
    <span style="font-size: 15px; color: #aab6cc;">Iedereen ziet deze opdracht.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <sc-if value="{{ pending }}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled="disabled" style="min-height: 52px; border-radius: 999px; border: 0; background: #22d3ee; color: #04121a; font-size: 16px; font-weight: 800; opacity: 0.45; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 999px; border: 2.5px solid #04121a; border-right-color: transparent; animation: spin 0.8s linear infinite;"></span>Opslaan…
      </button>
      <button type="button" disabled="disabled" style="min-height: 48px; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.34); background: transparent; color: #f8fafc; font-size: 16px; font-weight: 700; opacity: 0.45;">Overslaan</button>
    </sc-if>
    <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
      <a href="Truth-Waiting.dc.html" style="min-height: 52px; border-radius: 999px; background: #22d3ee; color: #04121a; font-size: 16px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center;">Gedaan</a>
      <a href="Truth-Waiting.dc.html" style="min-height: 48px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.34); color: #f8fafc; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center;">Overslaan</a>
    </sc-if>
    <span style="font-size: 14px; color: #aab6cc; text-align: center;">Overslaan mag altijd · Hierna: Noor</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["familie","feest","18+","longPrompt","saving"],"default":"familie"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'familie';
    const prompts = {
      familie: { cat: 'Doen', level: 'Familie', size: '32px', text: 'Laat Noor je kapsel opnieuw stylen, zonder kam of borstel.' },
      feest: { cat: 'Durven', level: 'Feest', size: '32px', text: 'Zing het refrein van een liedje naar keuze, fluisterend en met een heel serieus gezicht.' },
      '18+': { cat: 'Waarheid', level: '18+', size: '32px', text: 'Met wie in deze kamer zou je het liefst op date gaan, en waarom?' },
      longPrompt: { cat: 'Waarheid', level: 'Feest', size: '26px', text: 'Wat is het meest gênante dat je ooit per ongeluk hebt gezegd tegen iemand die je net had leren kennen, en hoe heb je dat daarna nog proberen recht te zetten?' },
    };
    const p = prompts[s] ?? prompts.familie;
    return { p, pending: s === 'saving', ready: s !== 'saving' };
  }
}
</script>
</body>
</html>
