<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Doen, Durven of de Waarheid, kiezen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button,a{font:inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 20px; background: #080a12; color: #f8fafc; font-family: Manrope, ui-sans-serif, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <button type="button" aria-label="Menu" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.34); background: #121626; color: #f8fafc; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
      <span style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #a78bfa;">Doen, durven of de waarheid</span>
      <span style="font-size: 13px; font-weight: 600; color: #aab6cc;">Ronde 3 · 6 spelers</span>
    </div>
    <span style="padding: 5px 10px; border-radius: 999px; background: rgba(167, 139, 250, 0.16); color: #a78bfa; font-size: 13px; font-weight: 800;">Familie, Feest</span>
  </div>

  <sc-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: #191f34; font-size: 14px; line-height: 20px;">
      <span aria-hidden="true" style="width: 14px; height: 14px; flex-shrink: 0; border-radius: 999px; border: 2px solid #aab6cc; border-right-color: transparent; animation: spin 0.9s linear infinite;"></span>
      <span>Verbinding herstellen… Je keuze wordt verstuurd zodra je weer online bent.</span>
    </div>
  </sc-if>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px;">
    <span style="font-size: 15px; font-weight: 700; color: #a78bfa;">Lotte, jij bent aan de beurt</span>
    <h1 style="margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 34px; line-height: 1.12; font-weight: 700;">Wat kies je?</h1>
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="3">
      <sc-if value="{{ c.busy }}" hint-placeholder-val="{{ false }}">
        <button type="button" disabled="disabled" aria-busy="true" style="min-height: 84px; display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 18px; border: 2px solid #22d3ee; background: rgba(34, 211, 238, 0.14); color: #f8fafc; text-align: left;">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 22px; font-weight: 800;">{{ c.name }}</span><span style="font-size: 14px; color: #aab6cc;">Opdracht ophalen…</span></span>
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 999px; border: 2.5px solid #22d3ee; border-right-color: transparent; animation: spin 0.8s linear infinite;"></span>
        </button>
      </sc-if>
      <sc-if value="{{ c.idle }}" hint-placeholder-val="{{ true }}">
        <a href="Truth-Prompt.dc.html" aria-disabled="{{ c.dim }}" style="min-height: 84px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 18px; border: 2px solid rgba(148, 163, 184, 0.18); background: #121626; color: #f8fafc; text-decoration: none; opacity: {{ c.opacity }};">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 22px; font-weight: 800;">{{ c.name }}</span><span style="font-size: 14px; color: #aab6cc;">{{ c.hint }}</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aab6cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </sc-if>
    </sc-for>
  </div>

  <span style="font-size: 14px; color: #aab6cc; text-align: center;">Iedereen ziet straks je opdracht · Hierna: Noor</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["choosing","sending","reconnecting"],"default":"choosing"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'choosing';
    const sending = s === 'sending';
    const cats = [
      ['Doen', 'Een opdracht uitvoeren'],
      ['Durven', 'Iets spannends wagen'],
      ['Waarheid', 'Eerlijk antwoord geven'],
    ].map(([name, hint], i) => ({
      name, hint,
      busy: sending && i === 2,
      idle: !(sending && i === 2),
      dim: sending ? 'true' : 'false',
      opacity: sending ? 0.45 : 1,
    }));
    return { cats, offline: s === 'reconnecting' };
  }
}
</script>
</body>
</html>
