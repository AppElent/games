<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Doen, Durven of de Waarheid, wachten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button,a{font:inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 20px; background: #080a12; color: #f8fafc; font-family: Manrope, ui-sans-serif, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <button type="button" aria-label="Menu" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.34); background: #121626; color: #f8fafc; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
      <span style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #a78bfa;">Doen, durven of de waarheid</span>
      <span style="font-size: 13px; font-weight: 600; color: #aab6cc;">Ronde 3 · 6 spelers</span>
    </div>
    <span style="padding: 5px 10px; border-radius: 999px; background: rgba(167, 139, 250, 0.16); color: #a78bfa; font-size: 13px; font-weight: 800;">Familie, Feest</span>
  </div>

  <sc-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: #191f34; font-size: 14px; line-height: 20px;">
      <span aria-hidden="true" style="width: 14px; height: 14px; flex-shrink: 0; border-radius: 999px; border: 2px solid #aab6cc; border-right-color: transparent; animation: spin 0.9s linear infinite;"></span>
      <span>Verbinding herstellen…</span>
    </div>
  </sc-if>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center;">
    <span style="width: 88px; height: 88px; border-radius: 999px; background: rgba(167, 139, 250, 0.16); border: 2px solid #a78bfa; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700;">L</span>
    <h1 role="status" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; line-height: 1.12; font-weight: 700;">Lotte kiest…</h1>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 16px; color: #aab6cc;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #a78bfa; animation: pulse 1.4s ease-in-out infinite;"></span>Doen, durven of de waarheid?</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-radius: 18px; background: #121626; border: 1px solid rgba(148, 163, 184, 0.18);">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #aab6cc; padding: 4px 0;">Volgorde</span>
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
      <sc-for list="{{ order }}" as="p" hint-placeholder-count="4">
        <li style="min-height: 40px; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: {{ p.weight }};"><span>{{ p.name }}</span><span style="font-size: 13px; font-weight: 700; color: {{ p.tone }};">{{ p.tag }}</span></li>
      </sc-for>
    </ol>
  </div>
  <a href="Truth-Watch.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; color: #aab6cc; font-size: 14px; font-weight: 700; text-decoration: none;">Prototype: Lotte heeft gekozen</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["choosing","reconnecting"],"default":"choosing"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'choosing';
    const order = [
      { name: 'Lotte', tag: 'Nu', tone: '#a78bfa', weight: 800 },
      { name: 'Noor (jij)', tag: 'Hierna', tone: '#f8fafc', weight: 800 },
      { name: 'Daan', tag: '', tone: '#aab6cc', weight: 600 },
      { name: 'Mila', tag: '', tone: '#aab6cc', weight: 600 },
    ];
    return { order, offline: s === 'reconnecting' };
  }
}
</script>
</body>
</html>
