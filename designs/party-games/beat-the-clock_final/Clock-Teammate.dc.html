<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beat the Clock, teammate guessing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button,a{font:inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 16px; background: #080a12; color: #f8fafc; font-family: Manrope, ui-sans-serif, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="Clock-Pause.dc.html" aria-label="Pause" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.34); background: #121626; color: #f8fafc; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
      <span style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #fbbf24;">Beat the Clock</span>
      <span style="font-size: 13px; font-weight: 600; color: #aab6cc;">Turn 7 · first to 30</span>
    </div>
    <span style="font-size: 13px; font-weight: 700; color: #aab6cc;">Room K7QX</span>
  </div>

  <sc-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: #191f34; font-size: 14px; line-height: 20px;">
      <span aria-hidden="true" style="width: 14px; height: 14px; flex-shrink: 0; border-radius: 999px; border: 2px solid #aab6cc; border-right-color: transparent; animation: spin 0.9s linear infinite;"></span>
      <span>Reconnecting… Keep guessing out loud.</span>
    </div>
  </sc-if>

  <div style="display: flex; align-items: center; gap: 10px;">
    <span style="padding: 6px 12px; border-radius: 999px; background: rgba(251, 191, 36, 0.16); color: #fbbf24; font-size: 14px; font-weight: 800;">Comets</span>
    <span style="font-size: 15px; color: #aab6cc;">Your team · Sam describes</span>
  </div>

  <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; text-align: center;">
      <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 999px; background: #fbbf24; animation: pulse 1.4s ease-in-out infinite;"></span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.12;">Get ready to guess</span>
      <span style="font-size: 16px; line-height: 24px; color: #aab6cc;">The clock starts when Sam taps Go.<br>Put your phone down and listen.</span>
    </div>
  </sc-if>

  <sc-if value="{{ describing }}" hint-placeholder-val="{{ true }}">
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; text-align: center;">
      <span role="timer" style="font-family: 'Space Grotesk', sans-serif; font-size: 136px; line-height: 1; font-weight: 700; color: #fbbf24; font-variant-numeric: tabular-nums;">0:17</span>
      <div role="progressbar" aria-label="Time left" aria-valuemin="0" aria-valuemax="30" aria-valuenow="17" style="width: 100%; height: 6px; border-radius: 999px; background: #191f34; overflow: hidden;">
        <div style="width: 57%; height: 6px; border-radius: 999px; background: #fbbf24;"></div>
      </div>
      <span style="margin-top: 20px; font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700;">Guess out loud</span>
      <div role="img" aria-label="2 of 5 words guessed" style="display: flex; gap: 10px; margin-top: 4px;">
        <span style="width: 22px; height: 22px; border-radius: 999px; background: #fbbf24;"></span>
        <span style="width: 22px; height: 22px; border-radius: 999px; background: #fbbf24;"></span>
        <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 999px; border: 2px solid rgba(148, 163, 184, 0.5);"></span>
        <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 999px; border: 2px solid rgba(148, 163, 184, 0.5);"></span>
        <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 999px; border: 2px solid rgba(148, 163, 184, 0.5);"></span>
      </div>
      <span style="font-size: 15px; font-weight: 700; color: #aab6cc;">2 of 5 guessed</span>
    </div>
    <a href="Clock-Checking.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; color: #aab6cc; font-size: 14px; font-weight: 700; text-decoration: none;">Prototype: jump to the referee check</a>
  </sc-if>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
    <div style="padding: 12px 14px; border-radius: 14px; background: #121626; border: 1px solid rgba(251, 191, 36, 0.5); display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; font-weight: 700; color: #aab6cc;">Comets</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700;">18 <span style="font-size: 15px; color: #fbbf24;">+2</span></span>
    </div>
    <div style="padding: 12px 14px; border-radius: 14px; background: #121626; border: 1px solid rgba(148, 163, 184, 0.18); display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; font-weight: 700; color: #aab6cc;">Rockets</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700;">21</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["ready","describing","reconnecting"],"default":"describing"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'describing';
    return { ready: s === 'ready', describing: s !== 'ready', offline: s === 'reconnecting' };
  }
}
</script>
</body>
</html>
