<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beat the Clock, room menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button,a{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #080a12; color: #f8fafc; font-family: Manrope, ui-sans-serif, system-ui, sans-serif;">
  <div aria-hidden="true" style="padding: 76px 20px 0; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 104px; line-height: 1; font-weight: 700; color: #fbbf24;">0:17</span>
    <div style="width: 100%; height: 6px; border-radius: 999px; background: #191f34;"><div style="width: 57%; height: 6px; border-radius: 999px; background: #fbbf24;"></div></div>
    <div style="width: 100%; height: 300px; margin-top: 30px; border-radius: 18px; background: #121626;"></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(4px);"></div>

  <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 20px; right: 20px; top: 230px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700;">Paused</span>
      <span style="font-size: 16px; line-height: 23px; color: #aab6cc;">Sam paused the game. The clock is stopped at 0:17 and starts again when Sam resumes.</span>
    </div>
  </sc-if>

  <sc-if value="{{ menu }}" hint-placeholder-val="{{ true }}">
    <div role="dialog" aria-modal="true" aria-labelledby="menu-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 20px 20px 28px; border-radius: 24px 24px 0 0; background: #121626; border-top: 1px solid rgba(148, 163, 184, 0.18); display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 6px;">
        <span id="menu-title" style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700;">{{ title }}</span>
        <a href="{{ back }}" aria-label="Close menu" style="width: 44px; height: 44px; border-radius: 999px; background: #191f34; color: #f8fafc; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </a>
      </div>
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <button type="button" onClick="{{ it.act }}" style="min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-radius: 14px; border: 0; background: #191f34; color: {{ it.color }}; font-size: 16px; font-weight: 700; text-align: left;">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;"><span>{{ it.label }}</span><span style="font-size: 13px; font-weight: 500; color: #aab6cc;">{{ it.hint }}</span></span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ confirm }}" hint-placeholder-val="{{ false }}">
    <div role="alertdialog" aria-modal="true" aria-labelledby="end-title" aria-describedby="end-body" style="position: absolute; left: 20px; right: 20px; top: 250px; box-sizing: border-box; padding: 22px 20px 20px; border-radius: 24px; background: #121626; border: 1px solid rgba(148, 163, 184, 0.18); display: flex; flex-direction: column; gap: 10px;">
      <span id="end-title" style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700;">End the game for everyone?</span>
      <span id="end-body" style="font-size: 15px; line-height: 22px; color: #aab6cc;">This turn won't count. Everyone sees the current scores as final: Rockets 21, Comets 18.</span>
      <a href="Clock-Winner.dc.html" style="margin-top: 8px; min-height: 52px; border-radius: 999px; background: #fb7185; color: #1a0509; font-size: 16px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center;">End game</a>
      <button type="button" onClick="{{ cancel }}" style="min-height: 48px; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.34); background: transparent; color: #f8fafc; font-size: 16px; font-weight: 700;">Keep playing</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["player","host","hostConfirmEnd","pausedByHost"],"default":"host"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { confirm: null };
  }
  componentDidUpdate(prev) {
    if (prev.state !== this.props.state) this.setState({ confirm: null });
  }
  renderVals() {
    const s = this.props.state ?? 'host';
    const host = s === 'host' || s === 'hostConfirmEnd';
    const confirm = this.state.confirm ?? (s === 'hostConfirmEnd');
    const noop = () => {};
    const items = host
      ? [
          { label: 'Pause for everyone', hint: 'Stops the clock on every phone', color: '#f8fafc', act: noop },
          { label: 'Skip this turn', hint: 'No points; Rockets go next', color: '#f8fafc', act: noop },
          { label: 'How to play', hint: '', color: '#f8fafc', act: noop },
          { label: 'End game', hint: 'Shows the scores as final', color: '#fb7185', act: () => this.setState({ confirm: true }) },
        ]
      : [
          { label: 'How to play', hint: '', color: '#f8fafc', act: noop },
          { label: 'Switch team', hint: 'From the next turn', color: '#f8fafc', act: noop },
          { label: 'Leave room', hint: 'You can rejoin with code K7QX', color: '#fb7185', act: noop },
        ];
    const paused = s === 'pausedByHost';
    return {
      items, paused,
      menu: !paused && !confirm,
      confirm: !paused && confirm,
      cancel: () => this.setState({ confirm: false }),
      title: host ? 'Host menu' : 'Menu',
      back: host ? 'Clock-Describer.dc.html' : 'Clock-Teammate.dc.html',
    };
  }
}
</script>
</body>
</html>
