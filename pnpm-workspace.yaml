packages:
  - "apps/*"
  - "packages/*"

# Supply-chain hardening: default-deny install/build lifecycle scripts,
# only allow packages that genuinely compile a native binary at install time.
allowBuilds:
  esbuild: true # vite/tailwind bundler binary
  lightningcss: true # tailwindcss v4 CSS transform binary
  sharp: true # image processing binary (transitive, wrangler/miniflare tooling)
  workerd: true # Cloudflare Workers runtime binary used by wrangler/miniflare dev server
  '@clerk/shared': false
  '@google/genai': false
  protobufjs: false
  tesseract.js: false # postinstall only prints a banner; dist ships prebuilt
  browser-tabs-lock: false # @clerk/expo transitive; postinstall is a banner
  core-js: false # postinstall only prints a funding banner
  node-datachannel: true # expo-device-hub: native binary for Android streaming
  "@parcel/watcher": false # eas-cli transitive; ships prebuilt binaries
  dtrace-provider: false # eas-cli transitive optional native probe
  unrs-resolver: false # jest transitive; ships prebuilt binaries
  "@sentry/cli": true # downloads the sentry-cli binary for native source-map and debug-symbol uploads
  lefthook: true # postinstall installs the git hooks

# Keeps Expo fingerprints identical across macOS and Windows checkouts
# (autolinking paths are part of the native fingerprint).
virtualStoreDirMaxLength: 60

# Install before `pnpm run <script>` when node_modules is stale.
verifyDepsBeforeRun: install

minimumReleaseAge: 4320 # 3 days — blocks the worm/account-takeover window
minimumReleaseAgeExclude:
  - "@appelent/*" # our own registry, always trusted

overrides:
  # GHSA-96hv-2xvq-fx4p — ws memory exhaustion DoS below 8.21.0, pulled in
  # transitively by wrangler/miniflare's dev server (@cloudflare/vite-plugin,
  # wrangler, convex, @tanstack/devtools-*, @google/genai).
  ws: ">=8.21.0"
  # GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q, GHSA-35p6-xmwp-9g52, GHSA-g8m3-5g58-fq7m
  # — undici TLS/SSRF/DoS/cookie issues below 7.28.0, pulled in transitively by
  # wrangler/miniflare and jsdom.
  undici: "^7.28.0"
  # convex lists the deprecated @clerk/clerk-react as an optional peer next to
  # @clerk/react, and pnpm auto-installs optional peers. The web app is on
  # @clerk/react (Clerk Core 3), so keep the old package out of the graph.
  "convex>@clerk/clerk-react": "-"
  # eas-cli (apps/mobile pins 26.0.0; 27.2.0 still has them) and
  # @expo/eas-json pin exact versions with open advisories, so Dependabot
  # security updates fail with security_update_not_possible. Drop each line once upstream moves past it.
  # joi GHSA-4528-x5fx-h6hg, GHSA-6h2x-m376-mqjq and older (< 17.13.9).
  "eas-cli>joi": "^17.13.9"
  "@expo/eas-json>joi": "^17.13.9"
  # minimatch GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74, GHSA-3ppc-4f35-3m26 (5.x < 5.1.8).
  "eas-cli>minimatch": "^5.1.9"
  # postcss-selector-parser GHSA-rj75-hqrm-r3gf (< 6.1.5), pinned by
  # @tailwindcss/typography 0.5.20 (latest).
  "@tailwindcss/typography>postcss-selector-parser": "^6.1.5"
  # APP-179 (2026-11-16): security floors for transitive packages Dependabot
  # flags as high, each inside the major its parent asks for. Sources: eas-cli
  # (tar, nanoid), Expo/TanStack build tooling (js-yaml, browserslist),
  # workbox-build's ajv (fast-uri) and TanStack devtools (launch-editor).
  "tar@<7.5.21": "^7.5.21"
  "nanoid@<3.3.18": "^3.3.18"
  "js-yaml@>=4 <4.3.2": "^4.3.2"
  "browserslist@<4.28.7": "^4.28.7"
  "fast-uri@<3.1.9": "^3.1.9"
  "launch-editor@<2.14.2": "^2.14.2"
  # APP-768 (2026-11-24): security floors for transitive packages with open
  # Dependabot alerts, inside the major each parent asks for (uuid and diff
  # excepted, below). Drop a line once nothing resolves below its floor.
  # node-forge GHSA-6889-vf6x-f3g5, GHSA-w4xr-hqv8-ch44, GHSA-6cv4-p8m7-4r25,
  # GHSA-j8rw-jp99-435v (<= 1.4.2); eas-cli and the Expo code signing packages.
  "node-forge@>=1 <1.4.3": "^1.4.3"
  # yaml GHSA-48c2-rrv3-qjmp (2.x < 2.8.3); eas-cli, @expo/steps.
  "yaml@>=2 <2.8.3": "^2.8.3"
  # ajv GHSA-2g4f-4pwh-qvx6 (8.x < 8.18.0); eas-cli.
  "ajv@>=8 <8.18.0": "^8.18.0"
  # serialize-javascript GHSA-m5mm-p8h7-m29v (< 7.1.3); workbox-build.
  "serialize-javascript@>=7 <7.1.3": "^7.1.3"
  # brace-expansion GHSA-q2hr-2g5m-vwhr (2.x < 2.1.7, 5.x < 5.0.12); minimatch.
  "brace-expansion@>=2 <2.1.7": "^2.1.7"
  "brace-expansion@>=5 <5.0.12": "^5.0.12"
  # protobufjs GHSA-j3f2-48v5-ccww (7.x < 7.6.5); eas-cli > centrifuge.
  "protobufjs@>=7 <7.6.5": "^7.6.5"
  # uuid GHSA-w5hq-g745-h8pq (< 11.1.1): xcode, @expo/bunyan and
  # @expo/rudder-sdk-node ask for 7 or 8 and call only v1() and v4(), the same
  # in 11, which still has a CommonJS build.
  "uuid@<11.1.1": "^11.1.1"
  # diff GHSA-73rr-hh4g-fpgx (6.x to < 8.0.3): eas-cli pins 7.0.0 and calls
  # only diffLines, the same in 8.
  "diff@>=6 <8.0.3": "^8.0.3"

patchedDependencies:
  expo-symbols@58.0.4: patches/expo-symbols@58.0.4.patch
